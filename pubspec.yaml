name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^7.6.4
  # audit:
  #   path: packages/audit
  auth:
    path: packages/auth
  dashboard:
    path: packages/dashboard
  core:
    path: packages/core
  finding:
    path: packages/finding
  capa:
    path: packages/capa
  core_services:
    path: packages/core_services

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  melos: ^7.5.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/QualiTrack.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true